/* View-specific alignment, including dense reviewer and mobile states. */
.decision-header {
  display:flex;
  flex-direction:column;
  align-items:flex-start;
  gap:8px;
  padding:0 0 17px;
  min-height:0
}
.decision-header .eyebrow {
  font-size:8px;
  margin:0;
  letter-spacing:1px
}
.decision-header h2 {
  font-size:15px
}
.decision-header .status-badge {
  margin-top:3px
}
.workflow-rail {
  gap:0;
  position:relative;
  isolation:isolate;
  margin:20px 0 24px
}
.workflow-rail:before {
  content:"";
  position:absolute;
  left:11px;
  right:11px;
  top:10px;
  height:1px;
  background:var(--line);
  z-index:-1
}
.workflow-rail>span {
  width:21px;
  height:21px;
  display:grid;
  place-items:center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:50%;
  font-size:8px;
  color:var(--muted)
}
.workflow-rail>span.done {
  color:var(--accent);
  background:var(--accent-soft);
  border-color:#e6daf9
}
.readiness h3 {
  font-size:10px;
  font-weight:600;
  margin-bottom:3px
}
.readiness-row small {
  margin-left:auto;
  font-size:8px;
  white-space:nowrap
}
.readiness-row.passed .check-circle {
  color:#74a993;
  background:#edf7f1
}
.readiness-row.pending .check-circle {
  color:#b3976c;
  background:#fbf1e2
}
.readiness-row.pending small {
  color:#bb9f76
}
.attention-card {
  display:grid;
  grid-template-columns:20px 1fr;
  column-gap:7px;
  row-gap:0
}
.attention-card>.attention-icon {
  grid-column:1;
  grid-row:1/3
}
.attention-card>strong,.attention-card>p,.attention-card>button {
  grid-column:2
}
.attention-card>strong {
  font-size:10px
}
.attention-card>p {
  margin:5px 0 7px
}
.attention-card>button {
  justify-self:start
}
.timeline-event>div>span {
  display:block;
  font-size:8px;
  margin-top:4px;
  color:#a99caf
}
.document-toolbar .tabs button {
  display:flex;
  align-items:center;
  gap:5px
}
.tabs em {
  font-style:normal;
  font-size:8px;
  background:var(--soft);
  color:var(--muted);
  border-radius:4px;
  padding:2px 4px;
  margin-left:2px
}
.evidence-heading {
  display:grid;
  grid-template-columns:52px 1fr;
  gap:6px 13px
}
.evidence-heading>span {
  grid-row:1/3;
  grid-column:1
}
.evidence-heading h2 {
  font-size:15px;
  align-self:end
}
.evidence-heading p {
  grid-column:2
}
.comment>header {
  display:flex;
  gap:7px;
  align-items:center
}
.comment .avatar {
  width:25px;
  height:25px;
  font-size:8px
}
.comment-state {
  font-size:8px;
  color:var(--amber);
  display:block;
  margin-top:8px
}
.comment-state.resolved {
  color:var(--green)
}
.comment-form>.button {
  margin-top:8px
}
.second-approval>div {
  display:flex;
  gap:7px;
  align-items:center;
  margin-bottom:7px
}
.second-approval>div strong {
  margin:0
}
.second-approval>span {
  display:block;
  margin-top:8px;
  color:var(--accent)
}
@media(max-width:690px) {
  .decision-header h2 {
    font-size:17px
  }
  .readiness h3 {
    font-size:12px
  }
  .readiness-row small {
    font-size:10px
  }
  .timeline-event>div>span {
    font-size:10px
  }
  .attention-card>strong {
    font-size:12px
  }
  .document-toolbar .tabs {
    gap:14px
  }
}
/* Prevent grid-item intrinsic height from pushing decision actions out of view. */
.workspace-grid>* {
  min-height:0;
  overflow:hidden
}
.decision-scroll {
  flex:1 1 0
}
.decision-actions {
  flex:0 0 auto
}
.decision-actions .decision-version {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  margin-top:10px;
  font-size:8px
}
.decision-actions .secondary-actions .button {
  padding:6px 8px;
  min-height:28px;
  font-size:9px
}
.mobile-logout {
  display:none
}
.mobile-profile {
  display:none
}
@media(max-width:930px) and (min-width:691px) {
  .document-pane {
    min-height:660px
  }
  .decision-scroll {
    flex:1 1 auto
  }
  .decision-pane {
    min-height:450px
  }
  .invoice-queue {
    min-height:650px
  }
}
@media(max-width:690px) {
  .workspace-grid>* {
    overflow:visible
  }
  .decision-scroll {
    flex:1 1 auto
  }
  .mobile-logout {
    display:inline-flex
  }
  .mobile-profile {
    display:flex;
    gap:12px;
    align-items:center;
    padding:13px;
    border:1px solid var(--line);
    border-radius:9px;
    background:var(--surface);
    margin-bottom:22px
  }
  .mobile-profile>div {
    flex:1;
    min-width:0
  }
  .mobile-profile strong,.mobile-profile small {
    display:block;
    font-size:11px
  }
  .mobile-profile small {
    color:var(--muted);
    margin-top:4px
  }
  .mobile-profile select {
    margin-top:10px;
    max-width:100%;
    width:100%;
    font-size:12px
  }
  .topbar-actions {
    gap:5px
  }
  .decision-actions .decision-version {
    font-size:9px
  }
  .decision-actions .secondary-actions .button {
    font-size:11px
  }
}

/* Essential account controls must remain reachable at every responsive breakpoint. */
@media (min-width:691px) and (max-height:900px) {
  .sidebar-note { display:none }
  .sidebar-bottom { padding-top:12px }
}
@media (max-width:1120px) {
  .mobile-logout { display:inline-flex }
}
@media (max-width:690px) {
  .sidebar { overflow:visible }
}
