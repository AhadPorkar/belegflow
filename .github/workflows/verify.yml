name: Verify BelegFlow
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  full-stack:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: belegflow_test
          POSTGRES_USER: belegflow
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U belegflow -d belegflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BF_DATABASE_URL: jdbc:postgresql://localhost:5432/belegflow_test
      BF_DATABASE_USER: belegflow
      BF_DATABASE_PASSWORD: ci-only-not-a-production-secret
      BF_INTEGRATION: "true"
      BF_DEMO: "true"
      BF_COOKIE_SECURE: "false"
      BF_REMINDER_DELAY_MS: "3600000"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"
      - name: Resolve frontend dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else
            echo '::warning::First resolution: review and commit the generated package-lock.json before releasing.'
            npm install
          fi
      - name: Client checks and production assets
        working-directory: frontend
        run: npm run typecheck && npm test && npm run build
      - name: Spring, domain and real PostgreSQL integration tests
        run: |
          chmod +x mvnw scripts/*.sh
          mkdir -p server/src/main/resources/static
          cp -R frontend/dist/. server/src/main/resources/static/
          ./mvnw --batch-mode --no-transfer-progress verify
      - name: Start the real application
        run: |
          java -jar server/target/belegflow-server-0.1.0.jar > /tmp/belegflow-server.log 2>&1 &
          for i in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/actuator/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/belegflow-server.log
          exit 1
      - name: Browser dependencies
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Real-browser journeys
        working-directory: frontend
        run: npm run test:e2e
      - name: Dependency vulnerability report
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: belegflow-verification
          path: |
            **/target/surefire-reports/**
            frontend/playwright-report/**
            frontend/test-results/**
            frontend/package-lock.json
            /tmp/belegflow-server.log
