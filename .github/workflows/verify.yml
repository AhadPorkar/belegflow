name: Verify BelegFlow
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      strict_coverage:
        description: Enforce release coverage thresholds (80% line, 70% branch)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: belegflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configuration-regression:
    name: Backend test compilation and regressions (no database)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BF_INTEGRATION: "false"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Compile every backend test before running regressions
        run: |
          chmod +x mvnw
          ./mvnw --batch-mode --no-transfer-progress test-compile
      - name: Run Jackson configuration and multipart request regressions
        run: |
          ./mvnw --batch-mode --no-transfer-progress -Dtest=JacksonConfigurationTest,MultipartRequestBuilderTest -Dsurefire.failIfNoSpecifiedTests=false test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: configuration-regression
          path: server/target/surefire-reports/**
  frontend:
    name: Frontend core, every screen, coverage and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BF_STRICT_COVERAGE: ${{ inputs.strict_coverage && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"
      - name: Check bilingual documentation and repository links
        run: python3 scripts/check-documentation.py
      - name: Resolve exact dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else
            echo '::warning::Review and commit the generated package-lock.json before releasing.'
            npm install
          fi
      - name: Type check, all unit/component tests and measured coverage
        working-directory: frontend
        run: npm run typecheck && npm run test:coverage && npm run build
      - name: Frontend vulnerability gate
        working-directory: frontend
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: frontend-verification
          path: |
            frontend/coverage/**
            frontend/test-results/**
            frontend/package-lock.json
  full-stack:
    name: All backend modules, real PostgreSQL and real-browser journeys
    needs: [configuration-regression, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: belegflow_test
          POSTGRES_USER: belegflow
          POSTGRES_PASSWORD: ci-only-not-a-production-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U belegflow -d belegflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BF_DATABASE_URL: jdbc:postgresql://localhost:5432/belegflow_test
      BF_DATABASE_USER: belegflow
      BF_DATABASE_PASSWORD: ci-only-not-a-production-secret
      BF_INTEGRATION: "true"
      BF_TEST_DATABASE_ACK: DISPOSABLE
      BF_DEMO: "true"
      BF_COOKIE_SECURE: "false"
      BF_REMINDER_INITIAL_DELAY_MS: "3600000"
      BF_REMINDER_DELAY_MS: "3600000"
      BF_STRICT_COVERAGE: ${{ inputs.strict_coverage && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"
      - name: Prepare browser dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npx playwright install --with-deps chromium
      - name: Complete application verification (fails when any integration suite is skipped)
        run: |
          chmod +x mvnw scripts/*.sh
          ./scripts/verify-all.sh
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: full-stack-verification
          path: |
            quality-results/**
            **/target/surefire-reports/**
            **/target/site/jacoco/**
            frontend/coverage/**
            frontend/test-results/**
            frontend/playwright-report/**
            frontend/package-lock.json
