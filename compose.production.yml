# Separate installation and volume. TLS reverse proxy on the host is REQUIRED.
# This is a single-instance pilot deployment, not an HA or certified configuration.
name: belegflow-production
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: belegflow
      POSTGRES_USER: belegflow
      POSTGRES_PASSWORD: ${BF_DATABASE_PASSWORD:?Set a production DB secret}
    volumes: ["pgdata:/var/lib/postgresql"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U belegflow -d belegflow"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    image: belegflow:0.2.1
    build: .
    ports: ["127.0.0.1:8080:8080"]
    environment:
      BF_DATABASE_URL: jdbc:postgresql://db:5432/belegflow
      BF_DATABASE_USER: belegflow
      BF_DATABASE_PASSWORD: ${BF_DATABASE_PASSWORD}
      BF_DEMO: "false"
      BF_COOKIE_SECURE: "true"
      BF_BOOTSTRAP_EMAIL: ${BF_BOOTSTRAP_EMAIL:?Set the initial admin email}
      BF_BOOTSTRAP_PASSWORD: ${BF_BOOTSTRAP_PASSWORD:?Set the initial admin password}
      BF_BOOTSTRAP_ORGANIZATION: ${BF_BOOTSTRAP_ORGANIZATION:?Set the organization name}
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    restart: unless-stopped
volumes:
  pgdata:
