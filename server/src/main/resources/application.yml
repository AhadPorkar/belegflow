spring:
  application:
    name: belegflow
  datasource:
    url: ${BF_DATABASE_URL:jdbc:postgresql://localhost:5432/belegflow}
    username: ${BF_DATABASE_USER:belegflow}
    password: ${BF_DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: 12
      connection-timeout: 10000
  flyway:
    enabled: ${BF_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    # Jackson 3 moved date features out of SerializationFeature.
    datatype:
      datetime:
        write-dates-as-timestamps: false
server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${BF_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-swallow-size: 11MB
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
bf:
  demo-enabled: ${BF_DEMO:false}
  reminder-initial-delay-ms: ${BF_REMINDER_INITIAL_DELAY_MS:30000}
  reminder-delay-ms: ${BF_REMINDER_DELAY_MS:900000}
  bootstrap-email: ${BF_BOOTSTRAP_EMAIL:}
  bootstrap-password: ${BF_BOOTSTRAP_PASSWORD:}
  bootstrap-organization: ${BF_BOOTSTRAP_ORGANIZATION:}
logging:
  level:
    root: INFO
    org.springframework.security: WARN
